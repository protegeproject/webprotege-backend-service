webprotege.database.name: webprotege-test
spring.application.name=test-webprotege-backend-service

webprotege.directories.uploads: /tmp/webprotege-test/uploads
webprotege.directories.data: /tmp/webprotege-test/data

spring.data.mongodb.auto-index-creation: true

# Tests drive the outbox relay explicitly; keep the background schedule off so it cannot race test assertions.
webprotege.events.outbox.relay-enabled=false

spring.main.allow-bean-definition-overriding=true

webprotege.entityGraph.edgeLimit=3000

# See the main application.properties for the rationale behind this cap.
webprotege.events.largeChangeThreshold=200


webprotege.rabbitmq.requestqueue=webprotege-backend-queue
webprotege.rabbitmq.responsequeue=webprotege-backend-response-queue
webprotege.rabbitmq.timeout=60000

webprotege.minio.access-key=webprotege
webprotege.minio.secret-key=webprotege
webprotege.minio.uploads-bucket-name=webprotege-uploads
webprotege.minio.revision-history-documents-bucket-name=revisionHistoryDocuments
webprotege.minio.end-point=http://localhost:9000

webprotege.readWriteLock.timeoutInMillies: 1000
webprotege.readWriteLock.maxRetries: 5

logging.level.root=INFO